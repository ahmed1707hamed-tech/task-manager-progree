name: Task Manager CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  backend:
    name: Backend - Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskmanager
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: taskpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U taskuser -d taskmanager"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://taskuser:taskpassword@localhost:5432/taskmanager

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Run backend lint
        working-directory: backend
        run: |
          ruff check .

      - name: Run backend tests
        working-directory: backend
        run: |
          pytest -q

  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: |
          npm run lint

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          cp .env.example .env

      - name: Build Docker Compose images
        run: |
          docker compose build

      - name: Deployment status
        if: always()
        run: |
          echo "### CI/CD Deployment Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend: Lint and tests completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: Lint and build completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker: Images built successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pipeline status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"